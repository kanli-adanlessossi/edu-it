# Alembic configuration for the EDU-IT data model (Req 4).
#
# The Migration_Runner loads this file, overrides sqlalchemy.url with the target
# database URL at runtime, and invokes the Alembic command API. Paths are
# resolved relative to this file's directory by the runner, so this config has
# no absolute paths.

[alembic]
# script_location and sqlalchemy.url are set programmatically by the runner.
script_location = .
version_locations = %(here)s/versions
# Match our version-script filenames (date-prefixed for readable ordering).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Use OS-native path separators for version_locations and prepend_sys_path on
# every platform. 'path_separator' replaces the deprecated
# 'version_path_separator' (Alembic 1.20+) and also governs prepend_sys_path.
path_separator = os
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
