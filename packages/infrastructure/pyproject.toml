# packages/infrastructure — infrastructure layer (port adapters).
#
# Implements the domain ports against real external systems. May depend on
# frameworks (Pydantic v2 for settings/validation); this is allowed here, not in
# the domain. Versions are pinned exactly per docs/adr/0001-versions.md.

[project]
name = "edu-it-infrastructure"
version = "0.0.0"
description = "EDU-IT infrastructure layer (adapters implementing domain ports)."
requires-python = ">=3.12"
dependencies = [
    "edu-it-domain",
    "pydantic==2.14.1",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    # Docker SDK for Python: dev-only DockerSandboxProvider (ADR 0001, hands-on-labs).
    "docker==7.2.0",
    # AWS SDK: reads the Live_Provider key from Secrets Manager (ai-content 4.13, ADR 0007).
    "boto3==1.43.123",
    # Official Kubernetes Python client: production K8sApiPort adapter of the
    # KubernetesSandboxProvider (kubernetes-deployment task 7, ADR 0009). Loaded lazily.
    "kubernetes==37.0.1",
    # OpenTelemetry SDK and OTLP/HTTP exporter: bounded trace export of the Api and the
    # Worker (kubernetes-deployment task 10.3, Req 13.1, 13.2). HTTP/protobuf avoids grpcio.
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    # Prometheus client: Lab_Metrics on the dedicated metrics port of the Api and the Worker
    # (kubernetes-deployment task 10.2, Req 13.3, 13.4, 13.12).
    "prometheus-client==0.26.0",
]

[project.scripts]
# The Migration_Runner CLI (Req 4): apply/rollback the full data-model schema.
edu-it-migrate = "edu_it_infrastructure.persistence.runner:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edu_it_infrastructure"]
# Ship the Alembic script template and config alongside the package so the
# Migration_Runner can locate them when installed as a wheel.
artifacts = [
    "edu_it_infrastructure/persistence/migrations/script.py.mako",
    "edu_it_infrastructure/persistence/migrations/alembic.ini",
]

[tool.uv.sources]
edu-it-domain = { workspace = true }
