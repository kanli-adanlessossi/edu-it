[tool.ruff.format]
# Ruff's formatter is the single formatter for all Python components.
quote-style = "double"

# -- mypy (typecheck) ---------------------------------------------------------
# On a type error mypy exits non-zero and prints `file:line: error: ...` for
# each error; it exits zero when clean.
[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
# Components are importable as top-level packages; namespace layout per package.
explicit_package_bases = true
mypy_path = [
    "packages/domain",
    "packages/application",
    "packages/infrastructure",
    "apps/api",
    "apps/worker",
]
files = [
    "packages/domain",
    "packages/application",
    "packages/infrastructure",
    "apps/api",
    "apps/worker",
]
exclude = "(^|/)(\\.venv|node_modules)/"

# -- pytest (test) ------------------------------------------------------------
# On a test failure pytest exits non-zero and identifies the failing tests; it
# exits zero when every collected test passes. `--import-mode=importlib` keeps
# same-named test modules across components from colliding.
[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = [
    "packages/domain",
    "packages/application",
    "packages/infrastructure",
    "apps/api",
    "apps/worker",
    # Repo-level tooling tests (import-boundary check + exit-status behavior).
    "tools/tests",
]
python_files = ["test_*.py", "*_test.py"]
