# apps/worker — task-queue consumer.
#
# Thin boundary over the shared Python package; consumes the Redis-backed queue.
# Depends inward on application and infrastructure. Versions are pinned exactly
# per docs/adr/0001-versions.md.

[project]
name = "edu-it-worker"
version = "0.0.0"
description = "EDU-IT task-queue consumer (worker)."
requires-python = ">=3.12"
dependencies = [
    "edu-it-domain",
    "edu-it-application",
    "edu-it-infrastructure",
    "edu-it-content",
    # Minimal ASGI surface for the worker's Health_Endpoint / Readiness_Endpoint
    # (Req 18). Starlette is the same ASGI toolkit that backs the API's FastAPI,
    # so the worker adds no second web stack. Pinned exactly per
    # docs/adr/0001-versions.md.
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.scripts]
# The privileged-user CLI (Req 13.2): create/update a user and grant a
# privileged reviewer/author/admin role. The only path that provisions
# privileged roles; self-service never does (Req 13.3).
edu-it-grant-role = "edu_it_worker.privileged_user_cli:main"
# Staged AI content generation (ai-content Req 5, 10, 12): one Stage per run, on a new
# Generation_Branch that is left for review. Honors the stage gate and the budget gate.
edu-it-generate = "edu_it_worker.ai.cli:entry"
# Eval_Suite runner (ai-content Req 11): runs the Golden_Set cases against the current Prompt
# versions and writes the Eval_Report. Replay only under EDU_IT_ENV=test; --live is budgeted.
edu-it-eval = "edu_it_worker.ai.cli:eval_entry"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edu_it_worker"]

[tool.uv.sources]
edu-it-domain = { workspace = true }
edu-it-application = { workspace = true }
edu-it-infrastructure = { workspace = true }
edu-it-content = { workspace = true }
