# apps/api — FastAPI boundary.
#
# Thin HTTP boundary over the shared Python package; validates with Pydantic v2.
# Depends inward on application and infrastructure. Versions are pinned exactly
# per docs/adr/0001-versions.md.

[project]
name = "edu-it-api"
version = "0.0.0"
description = "EDU-IT FastAPI boundary (auth, sessions, HTTP endpoints)."
requires-python = ">=3.12"
dependencies = [
    "edu-it-domain",
    "edu-it-application",
    "edu-it-infrastructure",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edu_it_api"]

[tool.uv.sources]
edu-it-domain = { workspace = true }
edu-it-application = { workspace = true }
edu-it-infrastructure = { workspace = true }
