{{- /* One ServiceAccount each for Api, Worker and Migration_Job (Req 4.6, 10.8). No token automount. */ -}}
{{- range $component := list "api" "worker" "migration" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "edu-it.serviceAccountName" (dict "root" $ "component" $component) }}
  namespace: {{ include "edu-it.platformNamespace" $ }}
  labels:
    {{- include "edu-it.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- $wi := and (ne (toString $.Values.workloadIdentity.type) "none") $.Values.workloadIdentity.annotations }}
  {{- if or $wi (eq $component "migration") }}
  annotations:
    {{- if $wi }}
    {{- toYaml $.Values.workloadIdentity.annotations | nindent 4 }}
    {{- end }}
    {{- if eq $component "migration" }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
