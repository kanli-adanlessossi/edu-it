{{- /*
Database ExternalSecret for the Migration_Job, rendered as a pre-install,pre-upgrade hook with
weight -10 so the synced Secret exists before the Job runs on first install (risk R7, Req 21.1).
`creationPolicy: Orphan` keeps the synced Secret when Helm removes the hook object
(before-hook-creation), so the Api and Worker keep reading it. The other ExternalSecrets are in
externalsecrets.yaml (same store, kind and refresh settings). Not rendered when devSecrets.enabled (the dev Secret in secrets-dev.yaml is used).
*/ -}}
{{- if not .Values.devSecrets.enabled }}
{{- $ctx := dict "root" . "component" "database" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "edu-it.componentName" $ctx }}
  namespace: {{ include "edu-it.platformNamespace" . }}
  labels:
    {{- include "edu-it.labels" $ctx | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName | quote }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ include "edu-it.componentName" $ctx }}
    creationPolicy: Orphan
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.database | quote }}
        property: url
{{- end }}
