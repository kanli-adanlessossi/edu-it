{{- /*
One ExternalSecret per secret the Api, Worker or Migration_Job read (Req 10.1, 10.2, 10.5, 23.5),
generated from the same catalog as the secret volumes (edu-it.secretCatalog), so an unread secret
has none. The store name, the store kind and every remote key come from values (Req 10.7); no secret
value is rendered. The database ExternalSecret is the pre-install hook in externalsecret-database.yaml
(the Migration_Job needs it before the first install), so it is skipped here.
Not rendered when devSecrets.enabled: plain Secrets exist only for the dev Target (secrets-dev.yaml, Req 10.9).
*/ -}}
{{- if not .Values.devSecrets.enabled }}
{{- $catalog := include "edu-it.secretCatalog" . | fromJson }}
{{- range $name := (include "edu-it.secretNames" . | fromJsonArray) }}
{{- if ne $name "database" }}
{{- $entry := index $catalog $name }}
{{- $remote := index $.Values.externalSecrets.remoteKeys $entry.remoteKey }}
{{- $ctx := dict "root" $ "component" $name }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "edu-it.componentName" $ctx }}
  namespace: {{ include "edu-it.platformNamespace" $ }}
  labels:
    {{- include "edu-it.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.storeName | quote }}
    kind: {{ $.Values.externalSecrets.storeKind }}
  target:
    name: {{ include "edu-it.componentName" $ctx }}
    creationPolicy: Owner
  data:
    {{- range $key := $entry.keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote | quote }}
        property: {{ $key }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
