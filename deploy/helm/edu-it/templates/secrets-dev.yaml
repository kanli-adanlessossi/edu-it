{{- /*
Dev-only plain Secret placeholders in place of ExternalSecrets (Req 10.9). Rendered only when
devSecrets.enabled. Values are obvious placeholders, not real credentials. One Secret per
distinct secret the Api, Worker and Migration_Job read; each key is mounted as a file.
*/ -}}
{{- if .Values.devSecrets.enabled }}
{{- $ns := include "edu-it.platformNamespace" . }}
{{- $pgHost := include "edu-it.componentName" (dict "root" . "component" "dev-postgres") }}
{{- $redisHost := include "edu-it.componentName" (dict "root" . "component" "dev-redis") }}
{{- $secrets := dict
  "database" (dict "url" (printf "postgresql://edu_it:edu-it-dev-placeholder@%s:5432/edu_it" $pgHost))
  "redis" (dict "url" (printf "redis://%s:6379/0" $redisHost))
  "session" (dict "key" "dev-placeholder-session-key")
  "llm" (dict "api-key" "dev-placeholder-llm-key")
  "object-storage" (dict "access-key" "dev-placeholder-access" "secret-key" "dev-placeholder-secret")
}}
{{- range $name := (keys $secrets | sortAlpha) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edu-it.componentName" (dict "root" $ "component" $name) }}
  namespace: {{ $ns }}
  labels:
    {{- include "edu-it.labels" (dict "root" $ "component" $name) | nindent 4 }}
  {{- if eq $name "database" }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
type: Opaque
stringData:
  {{- range $k, $v := index $secrets $name }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
