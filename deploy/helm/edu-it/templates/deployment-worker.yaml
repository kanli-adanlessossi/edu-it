{{- /*
Worker Deployment (tasks 6.13, 12.1). Requirements: 8.1, 8.5, 8.6, 8.12, 14.10, 14.11, 23.1.

- The Worker serves GET /health and GET /ready on WORKER_HEALTH_PORT (apps/worker/edu_it_worker/serve.py,
  health.py), bound to 0.0.0.0 so the kubelet probes reach it. The port is `worker.adminPort`.
- WORKER_TERMINATION_GRACE_SECONDS carries `worker.terminationGracePeriodSeconds`; the Worker
  re-queues unfinished jobs 5 s before it elapses.
- The required secret keys database/url and redis/url come from the optional secret volumes
  mounted at /var/run/secrets/edu-it/<name>/ (lifecycle.py REQUIRED_SECRET_KEYS).
- `replicas` is omitted when the HPA owns the count, so a `helm upgrade` never resets it.
*/ -}}
{{- $ctx := dict "root" . "component" "worker" }}
{{- $name := include "edu-it.componentName" $ctx }}
{{- $healthPort := int .Values.worker.adminPort }}
{{- $metricsPort := int .Values.worker.metricsPort }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "edu-it.platformNamespace" . }}
  labels:
    {{- include "edu-it.labels" $ctx | nindent 4 }}
spec:
  {{- if not .Values.worker.hpa.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "edu-it.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edu-it.labels" $ctx | nindent 8 }}
      {{- with (include "edu-it.scrapeAnnotations" $ctx | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "edu-it.serviceAccountName" $ctx }}
      {{- /* The ServiceAccount sets automountServiceAccountToken: false (Req 4.6); the Worker calls
      the Kubernetes API (pod lifecycle, exec), so its pod spec sets it to true. The projected,
      600 s token below (_kube-api-access.tpl) is what the client reads. */}}
      automountServiceAccountToken: true
      priorityClassName: {{ .Values.priorityClass.name }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "edu-it.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "edu-it.image" (dict "root" . "name" "worker") | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "edu-it.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ $healthPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ $metricsPort }}
              protocol: TCP
          env:
            - name: WORKER_HEALTH_HOST
              value: "0.0.0.0"
            - name: WORKER_HEALTH_PORT
              value: {{ $healthPort | quote }}
            - name: WORKER_METRICS_HOST
              value: "0.0.0.0"
            - name: WORKER_METRICS_PORT
              value: {{ $metricsPort | quote }}
            - name: WORKER_TERMINATION_GRACE_SECONDS
              value: {{ .Values.worker.terminationGracePeriodSeconds | quote }}
            - name: EDU_IT_ENV
              value: {{ .Values.environment | quote }}
            - name: SANDBOX_PROVIDER
              value: kubernetes
            - name: K8S_LABS_NAMESPACE
              value: {{ include "edu-it.labsNamespace" . | quote }}
            - name: SANDBOX_RUNTIME_KIND
              value: {{ .Values.labs.runtimeClass.kind | quote }}
            - name: SANDBOX_RUNTIME_CLASS
              value: {{ .Values.labs.runtimeClass.name | quote }}
            {{- include "edu-it.otelEnv" . | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "edu-it.componentName" (dict "root" . "component" "database") }}
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "edu-it.componentName" (dict "root" . "component" "redis") }}
                  key: url
          {{- include "edu-it.probes" (dict "root" . "component" "worker" "port" "health") | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "edu-it.kubeApiAccess.volumeMount" . | nindent 12 }}
            {{- include "edu-it.secretVolumeMounts" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "edu-it.kubeApiAccess.volume" . | nindent 8 }}
        {{- include "edu-it.secretVolumes" (dict "root" .) | nindent 8 }}
