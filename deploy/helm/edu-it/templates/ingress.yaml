{{- /*
Ingress for mode ingress-nginx (Req 9.1, 9.6, 9.8, 9.10). Task 12.5.
One host: /v1 (Api routes and the terminal WebSocket) goes to the Api Service, every other path
(the /fr and /en trees and the web app's root-level assets) goes to the web Service.
TLS comes from a certificate Secret reference in values; no certificate or key material is rendered (Req 9.8).
*/ -}}
{{- /* Mode and certificate reference are validated in _validation.tpl. */ -}}
{{- if eq .Values.ingress.mode "ingress-nginx" -}}
{{- $ns := include "edu-it.platformNamespace" . }}
{{- $apiCtx := dict "root" . "component" "api" }}
{{- $webCtx := dict "root" . "component" "web" }}
{{- $ws := .Values.ingress.websocket }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "edu-it.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "edu-it.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  annotations:
    # WebSocket timeouts in seconds (Req 9.4).
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ $ws.readTimeoutSeconds | int | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ $ws.sendTimeoutSeconds | int | quote }}
    # Upgrade and Connection header handling for the terminal WebSocket (Req 9.6).
    # ingress-nginx forwards the Upgrade/Connection headers automatically for WebSocket
    # backends, so no configuration-snippet is needed; omitting it keeps the chart
    # installable on hardened clusters where snippet annotations are disabled by default
    # (ingress-nginx allow-snippet-annotations=false, CVE-2023-5044 hardening).
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Everything except /v1 is the web app: the /fr and /en trees, the root locale redirect,
          # and its root-level assets (/_next/static chunks, /monaco). Without those the pages
          # never hydrate. The longest matching prefix wins, so /v1 still reaches the Api.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "edu-it.componentName" $webCtx }}
                port:
                  number: {{ int .Values.web.port }}
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "edu-it.componentName" $apiCtx }}
                port:
                  number: {{ int .Values.api.port }}
{{- end }}
